[project]
name = "teo-discord-bot"
version = "1.0.0"
description = "Teo, the Advanced Telerobotics Research Lab's assistant bot on Discord"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiohttp==3.14.5",
  "anthropic==2.2.0",
  "discord.py==2.7.1",
]

[project.scripts]
teo = "teo.bot:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["teo"]

# Dev tools pinned to the versions in ATR-Lab/dev-guidelines (configs/python/pyproject-snippet.toml).
[dependency-groups]
dev = [
  "mypy==2.4.0",
  "pytest>=8",
  "pytest-asyncio>=1",
  "ruff==0.17.1",
]

[tool.mypy]
# Strict typing gates the bot package; tests use fakes and stay untyped.
files = ["teo"]
python_version = "3.12"
strict = true
warn_unreachable = true
exclude = ["^\\.venv/", "^build/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
