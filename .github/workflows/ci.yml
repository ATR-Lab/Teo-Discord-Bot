name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, types and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3 # setup-uv publishes no moving major tag
        with:
          enable-cache: true
      - run: uv sync --locked --dev
      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Types (mypy --strict)
        run: uv run mypy
      - name: Tests
        run: uv run pytest
      - name: Shell scripts parse
        run: bash -n deploy/*.sh
